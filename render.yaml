services:
  # ============================================================
  # 1. KRYPTO Backend — FastAPI & Monte Carlo ML Engine
  # ============================================================
  - type: web
    name: krypto-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ============================================================
  # 2. KRYPTO Frontend — React 19 + Vite 8 Static SPA
  # ============================================================
  - type: web
    name: krypto-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: krypto-backend
          property: host
